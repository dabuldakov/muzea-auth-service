name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit-тесты
        run: ./gradlew --no-daemon test

      - name: Интеграционные тесты
        run: ./gradlew --no-daemon integrationTest

      - name: Гейт покрытия
        run: ./gradlew --no-daemon jacocoTestCoverageVerification

      - name: Отчёты о тестах
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/test
            build/reports/tests/integrationTest
            build/reports/jacoco
          if-no-files-found: ignore

  deploy:
    name: Deploy on VPS
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Verify deploy secrets
        env:
          S_HOST: ${{ secrets.DEPLOY_HOST }}
          S_USER: ${{ secrets.DEPLOY_USER }}
          S_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          S_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          missing=""
          [ -n "$S_HOST" ] || missing="$missing DEPLOY_HOST"
          [ -n "$S_USER" ] || missing="$missing DEPLOY_USER"
          [ -n "$S_KEY" ]  || missing="$missing DEPLOY_SSH_KEY"
          [ -n "$S_PATH" ] || missing="$missing DEPLOY_PATH"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (must be in Settings > Secrets and variables > Actions > Secrets, not Variables)"
            exit 1
          fi
          echo "All deploy secrets are present"
      - name: Pull main and rebuild app service
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          command_timeout: 30m
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            git fetch --prune origin main
            git reset --hard origin/main
            docker compose up -d --build
            docker image prune -f
