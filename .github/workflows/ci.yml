name: ci

# Тесты на pull request и на пуши в ветки. Для main тесты идут внутри
# deploy.yml, чтобы не запускать их дважды.
on:
  pull_request:
  push:
    branches-ignore: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit-тесты
        run: ./gradlew --no-daemon test

      - name: Интеграционные тесты
        run: ./gradlew --no-daemon integrationTest

      - name: Гейт покрытия
        run: ./gradlew --no-daemon jacocoTestCoverageVerification

      - name: Отчёты о тестах
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/test
            build/reports/tests/integrationTest
            build/reports/jacoco
          if-no-files-found: ignore
