plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '4.0.5'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.muzea'
version = '0.0.1-SNAPSHOT'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    // Spring Boot Starters
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // OAuth2 Resource Server: Nimbus (RS256/JWKS) + JwtDecoder + JwtAuthenticationConverter
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'

    // Swagger / OpenAPI
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'

    // Spring Boot Mail (email OTP)
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    // Database
    implementation 'org.postgresql:postgresql:42.7.1'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // Rate limiting (in-memory, одна нода)
    implementation 'com.github.ben-manes.caffeine:caffeine'

    // Utilities
    implementation 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-restclient'
    testImplementation 'org.springframework.boot:spring-boot-resttestclient'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // ArchUnit — проверка границ модулей и слоёв
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'

    // Testcontainers (интеграционные тесты с реальным PostgreSQL)
    testImplementation 'org.testcontainers:junit-jupiter:1.21.4'
    testImplementation 'org.testcontainers:postgresql:1.21.4'
}

test {
    useJUnitPlatform()
}

// В CI видно полный стек упавших тестов, а не только одну строку.
tasks.withType(Test).configureEach {
    testLogging {
        events 'failed'
        exceptionFormat = 'full'
        showStackTraces = true
    }
}

sourceSets {
    integrationTest {
        java.srcDirs = ['src/integrationTest/java']
        resources.srcDirs = ['src/integrationTest/resources']
        compileClasspath += sourceSets.main.output + sourceSets.test.output
        runtimeClasspath += sourceSets.test.runtimeClasspath
    }
}

configurations {
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}

tasks.register('integrationTest', Test) {
    description = 'Runs integration tests against a real PostgreSQL started in a Testcontainers container.'
    group = 'verification'
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    shouldRunAfter test
    useJUnitPlatform()
    include '**/*IT.class'
    failOnNoDiscoveredTests = false
}

jacoco {
    toolVersion = '0.8.12'
}

// Отчёт строится по данным и unit-, и integration-тестов.
jacocoTestReport {
    dependsOn test, integrationTest
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
    executionData.setFrom(
            fileTree(buildDir).include(
                    'jacoco/test.exec',
                    'jacoco/integrationTest.exec'
            )
    )
}

// Гейт покрытия бизнес-кода. Порог стартовый; поднимается по мере роста тестов.
jacocoTestCoverageVerification {
    dependsOn jacocoTestReport
    executionData.setFrom(jacocoTestReport.executionData)
    violationRules {
        rule {
            element = 'BUNDLE'
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.50
            }
        }
    }
}
