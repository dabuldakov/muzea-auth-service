services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: UTC
      PGTZ: UTC
    env_file:
      - .env
    ports:
      - "127.0.0.1:5437:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - auth-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "32mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 64m
    networks:
      - auth-network

  app:
    build: .
    restart: unless-stopped
    # Потолок памяти на реплику. JVM читает cgroup-лимит и берёт 40% под heap.
    mem_limit: 640m
    healthcheck:
      # wget есть в busybox внутри alpine-образа. 503 от actuator (например,
      # БД недоступна) тоже считается unhealthy.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      # Spring Boot стартует ~20-40s; не считаем это падением.
      start_period: 60s
    # Порт не публикуется наружу: масштабируем за nginx.
    deploy:
      replicas: ${APP_REPLICAS:-1}
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: ${POSTGRES_URL}
      DATABASE_USERNAME: ${POSTGRES_USERNAME}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: UTC
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      AUTH_ISSUER: ${AUTH_ISSUER}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE}
      # Приватный RSA-ключ (base64 PKCS#8). Без него prod не стартует.
      AUTH_RSA_PRIVATE_KEY: ${AUTH_RSA_PRIVATE_KEY}
      AUTH_RSA_KEY_ID: ${AUTH_RSA_KEY_ID:-primary}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AUTH_RATE_LIMIT_REDIS_ENABLED: "true"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - auth-network

  # Балансировщик: внешний порт 8087, внутри — на все реплики app.
  nginx:
    image: nginx:1.30-alpine
    restart: unless-stopped
    ports:
      - "8087:80"
      # Внутренний metrics-listener: только loopback хоста, скрейпится
      # Prometheus через SSH-туннель с машины мониторинга.
      - "127.0.0.1:9187:9187"
    volumes:
      - ./deploy:/etc/nginx/conf.d:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - auth-network

networks:
  auth-network:
    driver: bridge

volumes:
  postgres_data:
