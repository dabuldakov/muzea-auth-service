# Балансировщик для нескольких реплик app. Docker DNS отдаёт IP сервиса `app`,
# nginx распределяет запросы между ними (round-robin).
upstream auth_app {
    server app:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 1m;

    # Метрики приложения не публикуем наружу: их отдаёт отдельный listener
    # на loopback (см. server 9187 ниже) через SSH-туннель с машины мониторинга.
    location = /actuator/prometheus {
        return 404;
    }

    location / {
        proxy_pass http://auth_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}

# Внутренний listener для Prometheus. Публикуется только на 127.0.0.1 хоста
# (см. docker-compose.yaml), наружу не торчит. Отдаёт только метрики.
server {
    listen 9187;
    server_name _;

    location = /actuator/prometheus {
        proxy_pass http://auth_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }

    location / {
        return 404;
    }
}
