# Прод: все секреты обязательны из окружения, без небезопасных дефолтов.
spring:
  datasource:
    # Без дефолтов: приложение не должно стартовать с admin/admin в проде.
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    show-sql: false

app:
  mail:
    enabled: true

auth:
  # Нет дефолта — приложение не стартует без приватного ключа.
  rsa:
    private-key: ${AUTH_RSA_PRIVATE_KEY}

server:
  error:
    # Не раскрываем внутренние сообщения об ошибках наружу.
    include-message: never
    include-binding-errors: never

logging:
  level:
    com.muzea.auth: INFO

# Swagger/OpenAPI в проде отключён: не раскрываем карту auth-API.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
