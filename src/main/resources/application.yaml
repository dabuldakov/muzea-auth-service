spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5437/auth_db}
    username: ${DATABASE_USERNAME:admin}
    password: ${DATABASE_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    table: flyway_schema_history
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
    protocol: smtp

auth:
  # Идентификатор издателя и аудитории access-токенов.
  issuer: ${AUTH_ISSUER:https://auth.muzea.su}
  # Список ресурс-сервисов, которым адресован токен (через запятую).
  audience: ${AUTH_AUDIENCE:api-muzea,chat-muzea}
  access-token-ttl-seconds: ${AUTH_ACCESS_TTL_SECONDS:900}       # 15 минут
  refresh-token-ttl-seconds: ${AUTH_REFRESH_TTL_SECONDS:2592000} # 30 дней
  rsa:
    # base64-encoded PKCS#8 приватный ключ. Пусто в dev — ключ сгенерируется.
    private-key: ${AUTH_RSA_PRIVATE_KEY:}
    key-id: ${AUTH_RSA_KEY_ID:primary}
  otp:
    length: ${AUTH_OTP_LENGTH:6}
    ttl-seconds: ${AUTH_OTP_TTL_SECONDS:600}          # 10 минут
    max-attempts: ${AUTH_OTP_MAX_ATTEMPTS:5}
    request-cooldown-seconds: ${AUTH_OTP_COOLDOWN_SECONDS:60}
    max-requests-per-hour: ${AUTH_OTP_MAX_PER_HOUR:5}
  rate-limit:
    per-ip-hourly: ${AUTH_RATE_LIMIT_PER_IP_HOURLY:60}
    ip-cooldown-seconds: ${AUTH_RATE_LIMIT_IP_COOLDOWN_SECONDS:1}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:*}
  mail:
    # false — письма не отправляются, код пишется в лог (dev/CI).
    enabled: ${APP_MAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@muzea.su}

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

springdoc:
  api-docs:
    enabled: true
    path: /api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    doc-expansion: none
  packages-to-scan: com.muzea.auth
  paths-to-match: /auth/**,/.well-known/**
  cache:
    disabled: true

logging:
  level:
    org.flywaydb: INFO
  structured:
    format:
      console: logstash

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    mail:
      enabled: false
